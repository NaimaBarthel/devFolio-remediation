
services:
  mariadb:
    image: mariadb:10.11
    ports:
      - "0.0.0.0:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: devfolio
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - /var/lib/mysql:/var/lib/mysql
    # Pas de healthcheck
    # Pas de réseau isolé

  backend:
    build: ./backend
    depends_on:
      - mariadb
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/devfolio
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET}
      DEVFOLIO_ADMIN_PASSWORD: admin123
      DEBUG: "true"

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

